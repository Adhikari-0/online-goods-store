spring.application.name=online-goods-store

server.port=1001

# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/online-goods-store
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=your-very-long-secret-at-least-64-bytes-change-this-in-prod-xxxxxxxxxxxxxxxx
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.issuer=store-app
